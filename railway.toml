[build]
builder = "NIXPACKS"
buildCommand = "pnpm install --frozen-lockfile && pnpm --filter @fizioterapi/db prisma:generate && pnpm --filter @fizioterapi/types build && pnpm --filter @fizioterapi/db build && pnpm --filter @fizioterapi/api build"

[deploy]
startCommand = "pnpm --filter @fizioterapi/db prisma:migrate-deploy && node apps/api/dist/main.js"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
